[package]
name = "protohoggr-bench"
version = "0.0.0"
description = "Criterion benchmarks and the same-binary A/B tool for protohoggr. Not published."
license = "MIT OR Apache-2.0"
edition = "2024"
publish = false

[lints]
workspace = true

[features]
# examples/ab.rs: exchange which crate each harness slot is instantiated
# against (the BA leg).
swap = []
# examples/ab.rs: measure the baseline against protohoggr_ctl instead of the
# working tree (the AA control).
aa = []

[dependencies]
# The working tree: the candidate side of every comparison.
protohoggr = { path = ".." }

# Everything below is used by the bench targets and examples/ab.rs only.
[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# The baseline side of examples/ab.rs. Must be a commit reachable from the
# URL (cargo resolves this for every workspace build, so a local path or a
# file:// URL would break other checkouts). To compare against another
# commit, change both revs below together; see reference/performance.md.
protohoggr_base = { package = "protohoggr", git = "https://github.com/folknor/protohoggr", rev = "8a450a0bddf1901892df30061c3bf2c570dae1cb" }
# The same commit as protohoggr_base, spelled as a 12-character prefix.
# Cargo keys a git source by the rev string as written, so this is a second,
# separately compiled package of identical source: the AA control. Keep the
# prefix unambiguous and keep it naming the same commit as protohoggr_base.
protohoggr_ctl = { package = "protohoggr", git = "https://github.com/folknor/protohoggr", rev = "8a450a0bddf1" }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[target.'cfg(target_arch = "x86_64")'.dev-dependencies]
varint-simd = "0.4"

[[bench]]
name = "varint"
harness = false

[[bench]]
name = "message"
harness = false
